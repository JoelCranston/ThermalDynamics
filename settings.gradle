pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

includeBuild('../CoFHCore') {
    dependencySubstitution {
        substitute module('com.teamcofh:cofh_core') using project(':')
    }
}
includeBuild('../ThermalCore') {
    dependencySubstitution {
        substitute module('com.teamcofh:thermal_core') using project(':')
    }
}

rootProject.name = 'ThermalDynamics'
